<!-- Write Solution for Number Guessing Game using JavaScript. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
</head>
<body>
   <h1>Guess The Number</h1>
   
   <p>Guess Number between 1-100 in this field</p>

    <div class="form">
        <label for="guessField">Enter a guess:</label>
        <input type="number" min="1" id="guessField" class="guessField">
        <input type="submit" value="submit guess" class="guessSubmit"> 
    </div>

    <div class="results">
        <p class="guesses"></p>
        <p class="lastResult"></p>
        <p class="lowOrHi"></p>
    </div>
<script>
    let randomNum = Math.floor(Math.random() * 100 + 1);
    const guesses = document.querySelector('.guesses');
    const lastResult = document.querySelector('.lastResult');
    const lowOrHi = document.querySelector('.lowOrHi');
    const guessSubmit = document.querySelector('.guessSubmit');
    const guessField = document.querySelector('.guessField');
    let guessCount = 1;
    let resetButton;


function checkGuess(){
    const userGuess = Number(guessField.value);
    if(guessCount === 1){
        guesses.textContent = 'Previous guesses: ';
    }

    guesses.textContent = `${guesses.textContent} ${userGuess}`;

    if(userGuess === randomNum){
        lastResult.textContent = 'You guessed the Right Number!';
        lastResult.style.backgroundColor = 'green';
        lowOrHi.textContent = '';
        finishGame();
    }else if (guessCount === 10){
        lastResult.textContent = 'You finised all your guess!';
        lowOrHi.textContent = '';
        finishGame();
    }else {
        lastResult.textContent = 'Wrong Guess!!';
        lastResult.style.backgroundColor = 'red';
        if(userGuess < randomNum) {
            lowOrHi.textContent = 'Your guess is to low!';
        }else if(userGuess > randomNum) {
            lowOrHi.textContent = 'Your guess is to high!';
        }
    }
    guessCount++;
    guessField.value = '';
    guessField.focus();
}

guessSubmit.addEventListener('click',checkGuess);

function finishGame(){
    guessField.disabled = true;
    guessSubmit.disabled = true;
    resetButton = document.createElement('button');
    resetButton.textContent = "Start New Game";
    document.body.appendChild(resetButton);
    resetButton.addEventListener('click',resetGame);
}

function resetGame(){
    guessCount = 1;
    const resetParas = document.querySelectorAll('.results p');
    for(let para of resetParas){
        resetParas.textContent = '';
    }

    resetButton.parentNode.removeChild(resetButton);
    guessField.disabled = false;
    guessSubmit.disabled = false;
    guessField.value = '';
    guessField.focus();
    lastResult.style.backgroundColor = 'white';
    randomNum = Math.floor(Math.random() * 100 + 1);
}
</script>    
</body>
</html>
