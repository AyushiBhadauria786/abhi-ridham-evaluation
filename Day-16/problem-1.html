<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Problem - 1</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f4f8;
      }
      .container {
        text-align: center;
        padding: 25px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: #fff;
      }
      #display-count {
        font-size: 2em;
        margin-bottom: 20px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 1em;
        margin: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Counter</h1>
      <p id="display-count">0</p>
      <button id="minus-btn" class="btn">-</button> 
      <button id="plus-btn" class="btn">+</button>
    </div>
    <script src="problem-1.js"></script>
  </body>
</html>
